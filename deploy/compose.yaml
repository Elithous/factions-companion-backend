# Production stack: Caddy (HTTPS) in front of the Next.js frontend and the
# API, plus the ingestion worker, MySQL, and a nightly database backup.
#
# Expects the frontend repo cloned next to this one:
#   factions-companion-backend/deploy/compose.yaml   (this file)
#   factions-companion-frontend/
#
# Settings come from deploy/.env; see deploy.env.example and README.md.
name: factions-companion

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in deploy/.env}
      PORT: ${PORT:-4000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - server

  frontend:
    build:
      context: ../../factions-companion-frontend
      args:
        SITE_URL: ${SITE_URL}
        BACKEND_HOST: http://server
        BACKEND_PORT: ${PORT:-4000}
    restart: unless-stopped
    environment:
      # Server-side requests (page titles, link-preview images) go straight
      # to the API over the compose network.
      BACKEND_HOST: http://server
      BACKEND_PORT: ${PORT:-4000}
      SITE_URL: ${SITE_URL}
    depends_on:
      - server

  server:
    build:
      context: ..
      args:
        PORT: ${PORT:-4000}
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      # Caddy is the one proxy hop in front of the API.
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy

  # Same image as the API. Keep it at one replica: each worker connects to
  # every watched game.
  worker:
    build:
      context: ..
      args:
        PORT: ${PORT:-4000}
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  # Not published on the host; only the other services can reach it.
  db:
    image: mysql:9.1.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in deploy/.env}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

  # Writes a compressed dump to deploy/backups once a day.
  # Take one right now with: docker compose run --rm backup now
  backup:
    image: mysql:9.1.0
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      DB_NAME: ${DB_NAME}
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-04:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
